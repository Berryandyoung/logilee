<!DOCTYPE html>
<html lang="ko">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8548711851361478"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8" />
  <title>화물 추적</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    label, input, button {
      display: block;
      margin-bottom: 1em;
      padding: 10px;
      font-size: 1rem;
    }
    input {
      width: 100%;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .carrier-button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 1em;
    }
    .carrier-button-group button {
      flex: 1 1 auto;
      white-space: nowrap;
    }
    .result {
      background: #f8f8f8;
      padding: 20px;
      border-radius: 6px;
      margin-top: 20px;
      white-space: pre-wrap;
    }
    .home-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      padding: 8px 14px;
      margin-bottom: 20px;
      background-color: #005792;
      color: white;
      border: none;
      border-radius: 20px;
      text-decoration: none;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    .home-button:hover {
      background-color: #0078b6;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <a href="index-ko.html" class="home-button">홈으로</a>

  <h2>화물 추적</h2>

  <label>운송사 선택</label>
  <div class="carrier-button-group" id="carrier-buttons">
    <button type="button" onclick="selectCarrier('dhl', this)">DHL</button>
    <button type="button" onclick="selectCarrier('fedex', this)">FedEx</button>
    <button type="button" onclick="selectCarrier('ups', this)">UPS</button>
    <button type="button" onclick="selectCarrier('cj-korea-express', this)">CJ대한통운</button>
  </div>
  <input id="carrier" type="hidden" />

  <label for="trackingNo">운송장 번호</label>
  <input id="trackingNo" placeholder="예: 1234567890" />

  <button onclick="trackShipment()">조회하기</button>

  <div class="result" id="output">화물 추적 결과가 여기에 표시됩니다.</div>

  <script>
    function selectCarrier(slug, button) {
      document.getElementById("carrier").value = slug;
      const buttons = document.querySelectorAll("#carrier-buttons button");
      buttons.forEach((btn) => {
        btn.style.backgroundColor = "#007bff";
      });
      button.style.backgroundColor = "#0056b3";
    }

    function trackShipment() {
      const output = document.getElementById("output");
      output.textContent = "Legacy AfterShip browser integration has been disabled. Use the LOGILEE tracking hub or an approved server-side tracking proxy.";
    }
  </script>
</body>
</html>
