<!DOCTYPE html>

<html lang="ko">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8548711851361478"
     crossorigin="anonymous"></script>
<meta charset="utf-8"/>
<title>📅 날짜 계산기</title>
<style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      padding: 10px;
      width: 100%;
      margin-top: 15px;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      margin-top: 20px;
      font-weight: bold;
    }
    hr {
      margin: 30px 0;
    }
  </style>
<!-- Google tag (gtag.js) -->
<script async="" src="https://www.googletagmanager.com/gtag/js?id=G-F2ZQZDENW4"></script>

</head>
<body>
<h2>📏 날짜 계산기</h2>
<!-- 날짜 차이 계산기 -->
<label for="startDate">시작 날짜:</label>
<input id="startDate" max="9999-12-31" type="date"/>
<label for="endDate">종료 날짜:</label>
<input id="endDate" max="9999-12-31" type="date"/>
<button onclick="calculateDateDifference()">📅 날짜 차이 계산</button>
<div class="result" id="diffResult"></div>
<hr/>
<!-- 며칠 뒤 날짜 계산기 -->
<label for="baseDate">기준 날짜:</label>
<input id="baseDate" max="9999-12-31" type="date"/>
<label for="daysToAdd">며칠 후:</label>
<input id="daysToAdd" min="0" placeholder="예: 30" type="number"/>
<button onclick="calculateFutureDate()">📆 날짜 계산</button>
<div class="result" id="futureResult"></div>
<script>
    function calculateDateDifference() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      const resultEl = document.getElementById('diffResult');

      if (!start || !end) {
        resultEl.textContent = '❗ 두 날짜를 모두 선택해주세요.';
        return;
      }

      const startDate = new Date(start);
      const endDate = new Date(end);
      const diffTime = endDate - startDate;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        resultEl.textContent = `🔁 종료 날짜가 시작 날짜보다 이전입니다.`;
      } else {
        resultEl.textContent = `📏 두 날짜 사이의 차이는 ${diffDays}일입니다.`;
      }
    }

    function calculateFutureDate() {
      const base = document.getElementById('baseDate').value;
      const days = parseInt(document.getElementById('daysToAdd').value);
      const resultEl = document.getElementById('futureResult');

      if (!base || isNaN(days) || days < 0) {
        resultEl.textContent = '❗ 기준 날짜와 올바른 숫자를 입력해주세요.';
        return;
      }

      const baseDate = new Date(base);
      baseDate.setDate(baseDate.getDate() + days);

      const resultDate = baseDate.toISOString().split('T')[0];
      resultEl.textContent = `📆 ${days}일 후 날짜는 ${resultDate}입니다.`;
    }
  </script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const startInput = document.getElementById('startDate');
  const endInput = document.getElementById('endDate');

  // 연도 5자리 방지
  ['startDate', 'endDate', 'baseDate'].forEach(function(id) {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('change', function () {
        const year = this.value.split('-')[0];
        if (year.length > 4) {
          alert("⚠ 연도는 4자리까지만 입력 가능합니다.");
          this.value = '';
        }
      });
    }
  });

  // 시작 날짜 변경 시 종료 날짜 제한
  if (startInput && endInput) {
    startInput.addEventListener('change', function () {
      endInput.min = this.value;
    });

    endInput.addEventListener('change', function () {
      if (startInput.value && this.value < startInput.value) {
        alert("❗ 종료 날짜는 시작 날짜보다 빠를 수 없습니다.");
        this.value = '';
      }
    });
  }
});
</script><button onclick="window.location.href='index-ko.html'" style="margin-top: 30px; width: 100%; padding: 10px; font-size: 16px;">🏠 홈으로 돌아가기</button></body>
</html>
