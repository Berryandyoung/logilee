<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="CBM 계산기로 수출입 화물의 부피를 자동 계산하세요. cm 또는 inch 입력으로 CBM을 간편하게 산출하는 물류 계산기 | Logilee" name="description">
<title>CBM 계산기 | Logilee</title>
<style>
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 550px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
    }
    label {
      margin-top: 10px;
      display: block;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background-color: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      background-color: #f8f8f8;
      padding: 15px;
      border-radius: 6px;
      font-size: 16px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-direction: column;
    }
  </style>
<!-- Google tag (gtag.js) -->
<script async="" src="https://www.googletagmanager.com/gtag/js?id=G-F2ZQZDENW4"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F2ZQZDENW4');
  </script>
</meta>
<script async="" crossorigin="anonymous" src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1493616573815607"></script>
</head>
<body>
<h2>📦 CBM 계산기</h2>
<label for="unit">단위 선택:</label>
<select id="unit">
<option value="cm">센티미터 (cm)</option>
<option value="inch">인치 (inch)</option>
</select>
<label for="length">길이:</label>
<input id="length" min="0" placeholder="예: 120" type="number"/>
<label for="width">너비:</label>
<input id="width" min="0" placeholder="예: 80" type="number"/>
<label for="height">높이:</label>
<input id="height" min="0" placeholder="예: 60" type="number"/>
<label for="quantity">수량 (박스 수):</label>
<input id="quantity" min="1" placeholder="예: 10" type="number"/>
<div class="btn-group">
<button onclick="calculateCBM()">CBM 계산하기</button>
<button onclick="goHome()">🏠 홈으로 돌아가기</button>
</div>
<div class="result" id="result"></div>
<script>
    function calculateCBM() {
      const unit = document.getElementById('unit').value;
      let length = parseFloat(document.getElementById('length').value);
      let width = parseFloat(document.getElementById('width').value);
      let height = parseFloat(document.getElementById('height').value);
      const quantity = parseInt(document.getElementById('quantity').value);

      // 입력값이 음수이거나 유효하지 않은 경우
      if (
        isNaN(length) || isNaN(width) || isNaN(height) || isNaN(quantity) ||
        length < 0 || width < 0 || height < 0 || quantity < 1
      ) {
        document.getElementById('result').textContent = '❗ 모든 값을 올바르게 입력해 주세요. (0 이상)';
        return;
      }

      if (unit === 'cm') {
        length /= 100;
        width /= 100;
        height /= 100;
      } else if (unit === 'inch') {
        length *= 0.0254;
        width *= 0.0254;
        height *= 0.0254;
      }

      const cbmPerCarton = length * width * height;
      const totalCBM = cbmPerCarton * quantity;

      document.getElementById('result').innerHTML =
        `<strong>박스 1개당 CBM:</strong> ${cbmPerCarton.toFixed(4)} ㎥<br>
         <strong>총 CBM:</strong> ${totalCBM.toFixed(4)} ㎥`;
    }

    function goHome() {
      window.location.href = "index-ko.html"; // 필요시 경로 수정
    }
  </script>
</body>
</html>
