  <rect x="94" y="74" width="418" height="184" rx="8" fill="#e0f2fe" stroke="#0f5f99" stroke-width="4"/>
  <rect x="434" y="96" width="52" height="52" rx="8" fill="#fff" stroke="#0f2742" stroke-width="4"/>
  <ellipse cx="460" cy="122" rx="18" ry="11" fill="#dbeafe" stroke="#0f2742" stroke-width="3"/>
  <rect x="448" y="170" width="24" height="72" rx="5" fill="#2563eb"/>
