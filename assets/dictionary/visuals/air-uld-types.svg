  <rect x="88" y="214" width="228" height="26" rx="6" fill="#64748b"/>
  <path d="M106 214 L140 112 H278 L316 214 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <path d="M420 226 H612 V122 C570 86 498 86 452 122 L420 160 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
