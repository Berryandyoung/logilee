
<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8548711851361478"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔍 HS CODE Search (USITC Linked)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fa;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .home-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            padding: 8px 14px;
            margin-bottom: 20px;
            background-color: #005792;
            color: white;
            border: none;
            border-radius: 20px;
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, transform 0.2s ease;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .home-button:hover {
            background-color: #0078b6;
            transform: translateY(-2px);
        }

        .search-box {
            max-width: 400px;
            margin: 100px auto 40px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #005792;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0078b6;
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-button">🏠 Home</a>

    <h2>🔍 HS CODE Search</h2>
    <p>Enter a keyword or HS Code and search directly on the USITC website.</p>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Enter keyword or HS Code..." />
        <button onclick="searchUSITC()">Search on USITC</button>
    </div>
    <p>
        <a id="tradeDataLink" href="en/global-trade-explorer.html" style="color:#005792;font-weight:700;">View Global Trade Statistics</a>
        <br>
        <a id="euTradeDataLink" href="en/eu-trade-explorer.html" style="color:#005792;font-weight:700;">View EU Trade Statistics</a>
    </p>

    <script>
        const searchInput = document.getElementById("searchInput");
        const tradeDataLink = document.getElementById("tradeDataLink");
        const euTradeDataLink = document.getElementById("euTradeDataLink");
        searchInput.addEventListener("input", function() {
            const hs = searchInput.value.trim();
            tradeDataLink.href = hs ? `en/global-trade-explorer.html?hs=${encodeURIComponent(hs)}` : "en/global-trade-explorer.html";
            euTradeDataLink.href = hs ? `en/eu-trade-explorer.html?product=${encodeURIComponent(hs)}` : "en/eu-trade-explorer.html";
        });
        function searchUSITC() {
            const keyword = document.getElementById("searchInput").value.trim();
            if (!keyword) return;

            const searchURL = `https://hts.usitc.gov/?query=${encodeURIComponent(keyword)}`;
            window.open(searchURL, "_blank");
        }

        searchInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                searchUSITC();
            }
        });
    </script>

</body>
</html>
