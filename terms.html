  <h1>이용약관</h1>
  <p>본 약관은 Logilee 웹사이트 이용과 관련하여 회사와 이용자 간의 권리, 의무 및 책임사항 등을 규정합니다.</p>
  <h2>1. 서비스의 제공</h2>
  <p>Logilee는 정보 제공, 계산기 등 다양한 물류 관련 기능을 제공합니다.</p>
  <h2>2. 이용자의 의무</h2>
  <p>타인의 정보를 도용하거나, 사이트 운영을 방해하지 않아야 합니다.</p>
  <h2>3. 저작권</h2>
  <p>본 사이트에 포함된 모든 콘텐츠의 저작권은 Logilee에 있으며 무단 복제를 금합니다.</p>
  <h2>4. 책임의 한계</h2>
  <p>정보의 정확성이나 완전성을 보장하지 않으며, 이용자의 판단에 따라 사용됩니다.</p>
