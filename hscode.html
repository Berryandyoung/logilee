<!DOCTYPE html>
<html lang="ko">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8548711851361478" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HS Code 검색 | LOGILEE</title>
  <meta name="description" content="공식 USITC 조회로 HS Code를 검색하고 LOGILEE 무역 데이터 도구와 함께 분류 정보를 확인합니다.">
  <link rel="canonical" href="https://www.logilee.com/hscode.html">
  <link rel="alternate" hreflang="ko" href="https://www.logilee.com/hscode.html">
  <link rel="alternate" hreflang="en" href="https://www.logilee.com/hscode-en.html">
  <style>
    body {
      font-family: 'Segoe UI', 'Noto Sans KR', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7fa;
      color: #333;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .home-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      padding: 8px 14px;
      margin-bottom: 20px;
      background-color: #005792;
      color: white;
      border: none;
      border-radius: 20px;
      text-decoration: none;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease, transform 0.2s ease;
      position: absolute;
      top: 20px;
      left: 20px;
    }
    .home-button:hover {
      background-color: #0078b6;
      transform: translateY(-2px);
    }
    .search-box {
      max-width: 400px;
      margin: 100px auto 40px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #005792;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #0078b6;
    }
    footer {
      text-align: center;
      margin-top: 60px;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <a href="ko/" class="home-button">Home</a>
  <h1>HS Code 검색</h1>
  <p>검색어 또는 HS Code를 입력하면 공식 USITC 사이트에서 직접 조회할 수 있습니다.</p>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="검색어 또는 HS Code를 입력하세요.">
    <button onclick="searchUSITC()">USITC에서 검색</button>
  </div>
  <p>
    <a id="tradeDataLink" href="ko/global-trade-explorer.html" style="color:#005792;font-weight:700;">글로벌 무역 통계 보기</a>
    <br>
    <a id="euTradeDataLink" href="ko/eu-trade-explorer.html" style="color:#005792;font-weight:700;">EU 무역 통계 보기</a>
  </p>
  <script>
    const searchInput = document.getElementById("searchInput");
    const tradeDataLink = document.getElementById("tradeDataLink");
    const euTradeDataLink = document.getElementById("euTradeDataLink");
    searchInput.addEventListener("input", function() {
      const hs = searchInput.value.trim();
      tradeDataLink.href = hs ? `ko/global-trade-explorer.html?hs=${encodeURIComponent(hs)}` : "ko/global-trade-explorer.html";
      euTradeDataLink.href = hs ? `ko/eu-trade-explorer.html?product=${encodeURIComponent(hs)}` : "ko/eu-trade-explorer.html";
    });
    function searchUSITC() {
      const keyword = document.getElementById("searchInput").value.trim();
      if (!keyword) return;
      window.open(`https://hts.usitc.gov/?query=${encodeURIComponent(keyword)}`, "_blank");
    }
    searchInput.addEventListener("keypress", function(event) {
      if (event.key === "Enter") searchUSITC();
    });
  </script>
  <footer>2025 Logilee. All rights reserved.</footer>
</body>
</html>
