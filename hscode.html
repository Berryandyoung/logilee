<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔍 HS CODE 검색 (USITC 연동)</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Noto Sans KR', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fa;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .home-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            padding: 8px 14px;
            margin-bottom: 20px;
            background-color: #005792;
            color: white;
            border: none;
            border-radius: 20px;
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, transform 0.2s ease;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .home-button:hover {
            background-color: #0078b6;
            transform: translateY(-2px);
        }

        .search-box {
            max-width: 400px;
            margin: 100px auto 40px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #005792;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0078b6;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <a href="index-ko.html" class="home-button">🏠 홈</a>

    <h2>🔍 HS CODE 검색</h2>
    <p>검색어 또는 HS Code를 입력하면 미국 국제무역위원회(USITC) 사이트에서 직접 조회할 수 있습니다.</p>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="검색어 또는 HS Code를 입력하세요..." />
        <button onclick="searchUSITC()">USITC에서 검색하기</button>
    </div>

    <script>
        function searchUSITC() {
            const keyword = document.getElementById("searchInput").value.trim();
            if (!keyword) return;

            const searchURL = `https://hts.usitc.gov/?query=${encodeURIComponent(keyword)}`;
            window.open(searchURL, "_blank");
        }

        document.getElementById("searchInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                searchUSITC();
            }
        });
    </script>

    <footer>
        © 2025 Logilee. 모든 권리 보유.
    </footer>
</body>
</html>
